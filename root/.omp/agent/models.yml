providers:
  sudocode:
    baseUrl: https://api.sudocode.chat/v1
    # Resolve the key from the environment; export SUDOCODE_API_KEY before starting omp.
    apiKey: SUDOCODE_API_KEY
    authHeader: true
    api: openai-responses
    discovery:
      type: proxy
  sudorelay:
    baseUrl: https://api.sudorelay.com/v1
    # Resolve the key from the environment; export SUDOCODE_API_KEY before starting omp.
    apiKey: SUDOCODE_API_KEY
    authHeader: true
    api: openai-responses
    discovery:
      type: proxy
  zhaomoxing:
    baseUrl: https://api.zhaomoxing.com/v1
    apiKey: ZHAOMOXING_API_KEY
    authHeader: true
    api: openai-responses
    discovery:
      type: proxy
  灵算:
    baseUrl: https://edge.lingsuan.org
    apiKey: LINGSUAN_API_KEY
    authHeader: true
    api: openai-responses
    discovery:
      type: proxy
